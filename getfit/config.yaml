name: "Getfit"
version: "0.1.28"
slug: "getfit"
description: "Local-first Home Workout Assistant"
url: "https://github.com/ktgregson93-collab/Getfit"
startup: application
boot: auto
init: false
stage: stable
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
panel_icon: "mdi:dumbbell"
panel_title: "Getfit"
panel_admin: false
backup: cold
image: "ghcr.io/ktgregson93-collab/getfit"
map:
  - type: media
    read_only: true
options:
  treadmill_available: true
  treadmill_max_incline_percent: 20
  spin_bike_available: true
  adjustable_dumbbells_available: true
  kris_ha_user_id: ""
  kirsty_ha_user_id: ""
  pep_bridge_token: ""
  pep_bridge_allow_person_a: false
  pep_bridge_allow_person_b: false
schema:
  treadmill_available: bool
  treadmill_max_incline_percent: "int(0,20)"
  spin_bike_available: bool
  adjustable_dumbbells_available: bool
  kris_ha_user_id: str
  kirsty_ha_user_id: str
  pep_bridge_token: password
  pep_bridge_allow_person_a: bool
  pep_bridge_allow_person_b: bool
